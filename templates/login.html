<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Disease Outbreak Prediction System</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color-1: #1e3c72;
      --bg-color-2: #000428;
      --glass-bg: rgba(255, 255, 255, 0.1);
      --border-gradient: linear-gradient(45deg, #00f2fe, #4facfe);
      --text-light: #f5f5f5;
      --accent: #00f2fe;
      --circle-color: rgba(255, 255, 255, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 50%, var(--bg-color-1), var(--bg-color-2));
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 20px;
      animation: gradientMove 10s infinite alternate;
    }

    @keyframes gradientMove {
      0% { background-position: 50% 50%; }
      50% { background-position: 60% 40%; }
      100% { background-position: 50% 60%; }
    }

    /* Particles container */
    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
      top: 0;
      left: 0;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      background: var(--circle-color);
      filter: blur(50px);
      animation: float 10s infinite alternate;
      z-index: 0;
    }

    .circle:nth-child(2) {
      width: 200px;
      height: 200px;
      top: 20%;
      left: 10%;
      animation-delay: 0s;
    }

    .circle:nth-child(3) {
      width: 300px;
      height: 300px;
      bottom: 10%;
      right: 15%;
      animation-delay: 2s;
    }

    .circle:nth-child(4) {
      width: 150px;
      height: 150px;
      bottom: 30%;
      left: 25%;
      animation-delay: 4s;
    }

    @keyframes float {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(-20px) translateX(20px); }
    }

    .container {
      z-index: 2;
      background: var(--glass-bg);
      border: 2px solid transparent;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      backdrop-filter: blur(20px);
      width: 100%;
      max-width: 400px;
      text-align: center;
      position: relative;
      animation: fadeSlide 1.2s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container::before {
      content: "";
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: var(--border-gradient);
      z-index: -1;
      border-radius: 22px;
      padding: 2px;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      -webkit-mask-composite: destination-out;
    }

    .logo h1 {
      color: var(--text-light);
      font-size: 26px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    .logo p {
      color: #ddd;
      font-size: 14px;
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-group label {
      color: #ccc;
      font-weight: 500;
      display: block;
      margin-bottom: 8px;
      text-align: left;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-light);
      outline: none;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.2);
    }

    .form-group input:focus {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid var(--accent);
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #000;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px var(--accent);
    }

    .submit-btn:hover {
      background: #4facfe;
      color: white;
      box-shadow: 0 0 25px #4facfe;
    }

    .links {
      margin-top: 15px;
    }

    .links a {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s ease;
    }

    .links a:hover {
      color: #4facfe;
    }

    .error-message {
      background: rgba(255, 0, 0, 0.2);
      color: white;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>

<body>
  <!-- Particles background -->
  <div id="particles-js"></div>

  <!-- Background Circles -->
  <div class="circle"></div>
  <div class="circle"></div>
  <div class="circle"></div>

  <div class="container">
    <div class="logo">
      <h1>User Login</h1>
    </div>

    <div class="error-message" id="error-message"></div>

    <form method="POST" action="{{ url_for('login') }}" id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>

      <button type="submit" class="submit-btn">Login</button>

      <div class="links">
        <a href="{{ url_for('register') }}">Don't have an account? Register</a>
      </div>
    </form>
  </div>

  <!-- Load particles.js library -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

  <!-- Initialize particles -->
  <script>
  particlesJS('particles-js', {
    "particles": {
      "number": { "value": 50 },
      "color": { "value": "#ffffff" },
      "shape": { "type": "circle" },
      "opacity": { "value": 0.2 },
      "size": { "value": 3 },
      "move": { "enable": true, "speed": 1.5 }
    }
  });
  </script>

  <!-- Form validation script -->
  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMessage = document.getElementById('error-message');

      if (!username || !password) {
        e.preventDefault();
        errorMessage.style.display = 'block';
        errorMessage.textContent = 'Please fill in all fields';
      }
    });
    
  </script>
</body>
</html>
